[package]
name = "pyx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "pyx — see what a Python snippet will do before you run it"

[[bin]]
name = "pyx"
path = "src/main.rs"

[dependencies]
pyxray-core.workspace = true
pyxray-render.workspace = true
serde_json.workspace = true
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
