[workspace]
resolver = "2"
members = [
    "crates/pyxray-core",
    "crates/pyxray-render",
    "crates/pyx-cli",
    "crates/pyxray-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rvv522/pyxray"

[workspace.dependencies]
pyxray-core = { path = "crates/pyxray-core" }
pyxray-render = { path = "crates/pyxray-render" }
ruff_python_parser = "0.0.12"
ruff_python_ast = "0.0.12"
ruff_text_size = "0.0.12"
ruff_source_file = "0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
