name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: pyx (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  wheel: linux-x86_64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, wheel: linux-aarch64, cross: true }
          - { os: macos-13,       target: x86_64-apple-darwin,       wheel: macos-x86_64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,      wheel: macos-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    wheel: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: cross toolchain
        if: matrix.cross
        run: cargo install cross --locked
      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p pyx-cli --target ${{ matrix.target }}
          else
            cargo build --release -p pyx-cli --target ${{ matrix.target }}
          fi
      - name: package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          exe=pyx; [ "${{ runner.os }}" = Windows ] && exe=pyx.exe
          src=target/${{ matrix.target }}/release/$exe
          name=pyx-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}
          if [ "${{ runner.os }}" = Windows ]; then
            7z a dist/$name.zip $src README.md LICENSE >/dev/null
          else
            tar -C "$(dirname $src)" -czf dist/$name.tar.gz $exe
          fi
          # The wheel job bundles the binary for its own platform.
          mkdir -p bin && cp $src bin/
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.wheel }}
          path: bin/*

  wheels:
    name: wheel (${{ matrix.wheel }})
    runs-on: ${{ matrix.os }}
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64,  wheel: linux-x86_64,   manylinux: auto }
          - { os: ubuntu-latest,  target: aarch64, wheel: linux-aarch64,  manylinux: "2_28" }
          - { os: macos-13,       target: x86_64,  wheel: macos-x86_64 }
          - { os: macos-latest,   target: aarch64, wheel: macos-aarch64 }
          - { os: windows-latest, target: x64,     wheel: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.wheel }}
          path: python/pyxray/bin
      - name: make the bundled binary executable
        if: runner.os != 'Windows'
        run: chmod +x python/pyxray/bin/pyx
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [binaries, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: "archive-*"
          merge-multiple: true
          path: archives
      - name: GitHub release with the binaries
        uses: softprops/action-gh-release@v2
        with:
          files: archives/*
          generate_release_notes: true
      - name: PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - name: crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p pyxray-core --no-verify
          sleep 30
          cargo publish -p pyxray-render --no-verify
          sleep 30
          cargo publish -p pyx-cli --no-verify
