[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pyxray"
version = "0.1.0"
description = "See what a Python snippet will do before you run it"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ast", "static-analysis", "tui", "visualisation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
pyxray = "pyxray.__main__:main"

[tool.maturin]
manifest-path = "../crates/pyxray-py/Cargo.toml"
module-name = "pyxray._pyxray"
python-source = "."
features = ["pyo3/extension-module"]
