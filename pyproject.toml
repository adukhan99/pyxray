[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pyxray"
version = "0.1.0"
description = "See what a Python snippet will do before you run it"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ast", "static-analysis", "tui", "visualisation", "llm", "agent", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/adukhan99/pyxray"
Repository = "https://github.com/adukhan99/pyxray"
Issues = "https://github.com/adukhan99/pyxray/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pyxray = "pyxray.__main__:main"
# `pyx` execs the native binary bundled into the wheel by the release
# workflow (python/pyxray/bin/pyx[.exe]); see python/pyxray/_bin.py.
pyx = "pyxray._bin:main"

[tool.maturin]
manifest-path = "crates/pyxray-py/Cargo.toml"
module-name = "pyxray._pyxray"
python-source = "python"
features = ["pyo3/extension-module"]
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "python/pyxray/bin/**", format = "wheel" },
]
exclude = ["python/pyxray/_pyxray*.so", "python/pyxray/_pyxray*.pyd"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
